# Python tooling, aligned with Versatile Thermostat (see the code-conventions spec).
[tool.black]
line-length = 180

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["vtherm: the test runs the code of the real Versatile Thermostat of external/ (deselect with -m \"not vtherm\")"]

[tool.coverage.run]
source = ["custom_components/vtherm_dashboard"]
branch = true
# The tests and the generated frontend are not part of the measure.
omit = ["*/tests/*", "*/www/*"]

[tool.coverage.report]
show_missing = false
