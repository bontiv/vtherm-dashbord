# Minimal development configuration, copied into config/ when the container is created.
# Once copied, config/configuration.yaml can be edited freely (it is ignored by git).

homeassistant:
  name: VTherm Dashboard Dev
  unit_system: metric
  time_zone: Europe/Paris
  country: FR
  language: fr

frontend:
config:
# Without default_config, the integration "my" is not loaded, so the links /_my_redirect/... that the add-ons pages use (import of a
# blueprint, add-on repository) answer 404. A usual installation loads it.
my:
history:
logbook:

# Basic entities to create VTherm thermostats without hardware
input_boolean:
  dev_switch:
    name: Test switch

input_number:
  dev_temperature:
    name: Test temperature
    min: 0
    max: 40
    step: 0.1
    initial: 19
    unit_of_measurement: "°C"

logger:
  default: info
  logs:
    custom_components.versatile_thermostat: debug
    custom_components.vtherm_dashboard: debug
    vtherm_api: debug
